landdx-preset-period:
  name: LandDx Overlay, Preset Previous Period
  description: >-
    Mapbook of the mock elephants over the LandDx protected areas, compared with
    the 3 months before the time range.
  params:
    workflow_details:
      name: STE Mapbook
      description: Mapbook test with the LandDx overlay and a preset previous period.
    time_range:
      timezone:
        label: UTC
        tzCode: UTC
        name: UTC
        utc: '+00:00'
      since: '2011-01-01T00:00:00.000Z'
      until: '2012-01-01T00:00:00.000Z'
    er_client_name:
      data_source:
        name: mep_dev
    gee_project_name:
      data_source:
        name: ecoscope_poc
    subject_group_var:
      var: Elephants
    map_overlay:
      option: {}
    set_previous_period:
      offset:
        preset: 3 months back
    custom_trajs_filter:
      min_length_meters: 0.001
      max_length_meters: 5000
      min_time_secs: 1
      max_time_secs: 21600
      min_speed_kmhr: 0.01
      max_speed_kmhr: 9

custom-period:
  name: Custom Previous Period
  description: >-
    Mapbook of the mock elephants compared with a custom 6-month previous period,
    with a tighter map zoom.
  params:
    workflow_details:
      name: STE Mapbook
      description: Mapbook test with a custom previous period.
    time_range:
      timezone:
        label: UTC
        tzCode: UTC
        name: UTC
        utc: '+00:00'
      since: '2011-01-01T00:00:00.000Z'
      until: '2012-01-01T00:00:00.000Z'
    er_client_name:
      data_source:
        name: mep_dev
    gee_project_name:
      data_source:
        name: ecoscope_poc
    subject_group_var:
      var: Elephants
    map_overlay:
      option: {}
    set_previous_period:
      offset:
        months: 6
    custom_trajs_filter:
      min_length_meters: 0.001
      max_length_meters: 5000
      min_time_secs: 1
      max_time_secs: 21600
      min_speed_kmhr: 0.01
      max_speed_kmhr: 9
    zoom_to_envelope:
      expansion_factor: 1.2
